[package]
name = "library"
version = "0.1.0"
edition = "2024"

[lib]
name = "library"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
goblin = "0.10.5"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json = "0.12.4"
tokio = { version = "1", features = ["full"] }